name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autopoint gettext libtool-bin patch python3-dev
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36
          pip install jinja2==3.0.3

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r25b
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-sdk-ndk-${{ runner.os }}-

      - name: Cache p4a build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a
          key: p4a-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
          restore-keys: |
            p4a-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-

      - name: Write buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Jareth Adventure
          package.name = jarethadventure
          package.domain = org.rsociety
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,mp4
          source.exclude_patterns = buildozer.spec,*.pyc,__pycache__,runfull*.txt,error*.txt,resumen.txt
          version = 1.0
          requirements = python3,kivy,jnius
          orientation = portrait
          fullscreen = 1
          android.permissions =
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license = True
          android.archs = arm64-v8a, armeabi-v7a
          p4a.branch = v2024.01.21
          p4a.fork = kivy
          android.log_level = 2
          EOF

      - name: Pre-patch libffi
        run: |
          mkdir -p ~/.buildozer/android/packages
          cd ~/.buildozer/android/packages
          if [ ! -f libffi-3.3.tar.gz ]; then
            wget -q https://github.com/libffi/libffi/releases/download/v3.3/libffi-3.3.tar.gz || true
            tar -xzf libffi-3.3.tar.gz 2>/dev/null || true
            if [ -d libffi-3.3 ]; then
              grep -q LT_SYS_SYMBOL_USCORE libffi-3.3/configure.ac || echo 'm4_define([LT_SYS_SYMBOL_USCORE], [])' >> libffi-3.3/configure.ac
              tar -czf libffi-3.3-patched.tar.gz libffi-3.3 || true
            fi
          fi

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -200

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jareth-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Save failure log
        if: failure()
        run: |
          grep -E 'ERROR|error:|Traceback|ImportError|No matching|Could not find' ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/*.log 2>/dev/null > failure.log || true
        shell: bash

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log
          path: failure.log
          if-no-files-found: ignore
          retention-days: 7
